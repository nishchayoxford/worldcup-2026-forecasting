   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172e39" x="34.56" y="58.343606" transform="rotate(-0 34.56 58.343606)">The evidence behind the ratings</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596c72" x="34.56" y="73.555959" transform="rotate(-0 34.56 73.555959)">32,325 eligible matches across the pre-cutoff historical window.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #596c72" transform="translate(34.56 434.424037)">Counts are eligible international matches, not unique teams. Training begins in 1990; no time weighting is applied.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #596c72" transform="translate(34.56 448.374037)">2026 is a partial year ending 10 June. Annual volume is coverage, not a measure of predictive quality.</text>
  </g>
 </g>
