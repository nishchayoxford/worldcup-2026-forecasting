 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Apparent advantages carry uncertainty</dc:title>
    <dc:description>Paired log-loss differences; 4,000 resamples, seed 2026, percentile 95% intervals. Negative values favor the first model.
Group resampling keeps each group intact; only 12 clusters. Conditional on fixed models; not team/network robust or evidence of betting edge.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>World Cup 2026 forecasting</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
