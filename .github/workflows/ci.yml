name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0; Node 24
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python and locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Static checks
        run: uv run ruff check .
      - name: Automated tests
        run: uv run pytest -q
      - name: Reproduce every forecast and reported score
        run: uv run python run_pipeline.py --check
      - name: Rebuild publication figures
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run python plots.py
